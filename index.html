<style>
/* Layout: ID-card header (photo + identity) above a two-column ledger of details; stacks to one column on phones */
:root{
  --bg:#ffd60a; --surface:#ffe14d; --fg:#1f1a05; --muted:#5c4d0a; --line:#e6bf00;
  --accent:#1f1a05; --accent-soft:#ffec80; --red:#b3261e;
  --display:"Poppins","Segoe UI",system-ui,sans-serif;
  --body:"Baloo Da 2","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="light"]){
  --bg:#ffd60a; --surface:#ffe14d; --fg:#1f1a05; --muted:#5c4d0a; --line:#e6bf00;
  --accent:#1f1a05; --accent-soft:#ffec80; --red:#b3261e; color-scheme:light}}
:root[data-theme="dark"]{
  --bg:#ffd60a; --surface:#ffe14d; --fg:#1f1a05; --muted:#5c4d0a; --line:#e6bf00;
  --accent:#1f1a05; --accent-soft:#ffec80; --red:#b3261e; color-scheme:light}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 48px;display:grid;gap:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 16px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sample{font-size:13px;color:var(--muted);background:var(--accent-soft);padding:8px 12px;border-radius:8px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center}
.photo{width:180px;height:260px;max-width:100%;border-radius:10px;background:var(--accent-soft);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .initials{font-family:var(--display);font-size:48px;color:var(--accent)}
.photo label{position:absolute;inset:auto 0 0 0;background:var(--accent);color:var(--bg);font-size:12px;text-align:center;padding:6px;cursor:pointer}
.ident{min-width:0;display:grid;gap:6px}
.ident h1{font-family:"Rampart One","Poppins",system-ui,sans-serif;font-weight:400;letter-spacing:.04em;font-size:clamp(36px,7vw,60px);line-height:1.15;margin:0;text-wrap:balance}
.ident h1{background:linear-gradient(90deg,#d00000,#c2185b,#6a1b9a,#1565c0,#00897b,#2e7d32,#e65100,#d00000);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px rgba(255,255,255,.9));animation:shine 6s linear infinite,glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px rgba(255,255,255,.7))}to{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 12px #fff) drop-shadow(0 0 26px #fff)}}
@keyframes shine{to{background-position:300% 0}}
@media (prefers-reduced-motion:reduce){.ident h1{animation:none}}
.ident .sub{color:var(--muted);font-size:16px}
.bio{font-size:18px;font-weight:500}
.caption{font-family:var(--display);font-weight:700;font-size:clamp(17px,2.4vw,21px);line-height:1.4;text-wrap:balance;background:linear-gradient(90deg,#d00000,#c2185b,#6a1b9a,#1565c0,#00897b,#2e7d32,#e65100,#d00000);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 8px #fff);animation:shine 6s linear infinite,glow 2.4s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.caption{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg)}
.chip.goal{font-weight:600;border-width:2px;border-color:currentColor}
.chip.ok{border-color:var(--accent);color:var(--accent)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;min-width:0}
.panel h2{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
dl{margin:0;display:grid;grid-template-columns:minmax(110px,40%) 1fr;row-gap:10px;column-gap:14px}
dt{color:var(--muted);font-size:14px}
dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.full{grid-column:1/-1}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:500}
td.num{font-family:var(--mono)}
.cgpa{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.cgpa b{font-family:var(--display);font-size:40px;color:var(--accent);line-height:1}
.cgpa span{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent)}
.wa{display:inline-block;margin-top:14px;background:#128c4a;color:#fff;text-decoration:none;font-weight:600;padding:8px 16px;border-radius:8px}
.wa:hover{background:#0e7a40}
.social{display:flex;flex-wrap:wrap;gap:10px}
.wa.fb{background:#1877f2}
.wa.fb:hover{background:#1263cc}
.wa.tt{background:#111;box-shadow:-2px -2px 0 #25f4ee,2px 2px 0 #fe2c55}
.wa.tt:hover{background:#000}
.wa:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.qr{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.qrtxt{font-family:var(--display);font-weight:700;font-size:18px}
.qrimg{background:#fff;padding:8px;border-radius:10px;line-height:0}
.qrimg svg{width:170px;height:170px;max-width:100%}
.qr p{margin:0;max-width:40ch}
.gate{position:fixed;inset:0;z-index:50;perspective:1800px;overflow:hidden;background:#120b05}
.frame{position:absolute;inset:0;box-shadow:inset 0 0 0 14px #2b1a0c,inset 0 0 0 16px #120b05}
.door{position:absolute;top:0;bottom:0;width:50%;background-color:#6b4022;background-size:cover;display:grid;grid-template-rows:1fr 1fr;gap:4%;padding:7% 9%;box-sizing:border-box;transition:transform 1.8s cubic-bezier(.55,0,.25,1);box-shadow:inset 0 0 40px rgba(0,0,0,.55)}
.door.left{left:0;transform-origin:left center}
.door.right{right:0;transform-origin:right center}
.door.left::after,.door.right::after{content:"";position:absolute;top:0;bottom:0;width:4px}
.door.left::after{right:0;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,.8))}
.door.right::after{left:0;background:linear-gradient(90deg,rgba(0,0,0,.8),rgba(0,0,0,.2))}
.rpanel{border-radius:3px;background:inherit;background-size:cover;box-shadow:inset 3px 3px 0 rgba(255,220,170,.18),inset -3px -3px 0 rgba(0,0,0,.45),inset 0 0 0 10px rgba(0,0,0,.12),inset 12px 12px 0 -2px rgba(255,220,170,.06),inset -12px -12px 0 -2px rgba(0,0,0,.25),0 0 0 2px rgba(0,0,0,.35)}
.rpanel{position:relative}
.rpanel::before{content:"";position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);border:3px solid rgba(0,0,0,.35);box-shadow:inset 2px 2px 0 rgba(255,220,170,.15),2px 2px 0 rgba(255,220,170,.12);border-radius:2px}
.rpanel::after{content:"";position:absolute;inset:8px;border-radius:2px;background:radial-gradient(circle at 40% 40%,#fbe7a0 0 1.5px,#d4a83a 2.5px,#6b4a0c 4px,transparent 5px) 0 0/24px 24px;-webkit-mask:linear-gradient(#000,#000) top/100% 9px no-repeat,linear-gradient(#000,#000) bottom/100% 9px no-repeat,linear-gradient(#000,#000) left/9px 100% no-repeat,linear-gradient(#000,#000) right/9px 100% no-repeat;mask:linear-gradient(#000,#000) top/100% 9px no-repeat,linear-gradient(#000,#000) bottom/100% 9px no-repeat,linear-gradient(#000,#000) left/9px 100% no-repeat,linear-gradient(#000,#000) right/9px 100% no-repeat}
.door{border-top:10px solid #3b230f;border-bottom:10px solid #3b230f}
.hinge{position:absolute;width:18px;height:64px;border-radius:3px;background:linear-gradient(90deg,#2b2b2b,#8a8f94 45%,#c9cdd1 55%,#3a3d40);box-shadow:0 2px 4px rgba(0,0,0,.6)}
.hinge::before,.hinge::after{content:"";position:absolute;left:5px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e0e3e6,#3c3f42)}
.hinge::before{top:8px}.hinge::after{bottom:8px}
.door.left .hinge{left:6px}.door.right .hinge{right:6px}
.hinge.h1{top:14%}.hinge.h2{bottom:14%}
.ring{position:absolute;top:calc(50% - 175px);width:34px;height:34px;border-radius:50%;border:6px solid #b08a2a;box-shadow:0 3px 5px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,240,190,.5);box-sizing:border-box}
.door.left .ring{right:28px}.door.right .ring{left:28px}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,rgba(255,200,120,.12),transparent 45%),radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55));transition:opacity 1s}
.gate.open .door.left{transform:rotateY(-100deg)}
.gate.open .door.right{transform:rotateY(100deg)}
.gate.open{background:transparent;transition:background .6s 1.2s}
.gate.open .vignette,.gate.open .frame{opacity:0}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px;z-index:2;transition:opacity .5s;overflow-y:auto}
.gate.open .center{opacity:0;pointer-events:none}
.lockwrap{display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:swing 4s ease-in-out infinite}
.chainsvg{width:34px;height:auto;display:block}
.padlock{width:120px;height:auto;margin-top:-28px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.6))}
.shackle{transition:transform .45s ease-out}
.lockwrap.unlocked .shackle{transform:translateY(-16px)}
.lockwrap.unlocked{animation:drop .9s .45s cubic-bezier(.5,0,.9,.5) forwards}
@keyframes swing{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes drop{to{transform:translateY(120vh) rotate(30deg)}}
#gateForm{display:grid;gap:8px;width:100%;max-width:280px;padding:16px;border-radius:6px;box-sizing:border-box;text-align:center;background:linear-gradient(#2a1a0d,#1d1209);border:1px solid #6b4a20;box-shadow:0 8px 20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,220,160,.15)}
.plate{justify-self:center;font-family:Georgia,serif;font-weight:700;letter-spacing:.25em;color:#3b2604;padding:6px 16px;border-radius:3px;background:linear-gradient(#f1d37c,#c9982c 55%,#a87a14);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 3px rgba(0,0,0,.6);text-shadow:0 1px 0 rgba(255,240,190,.6)}
.gatelbl{font-weight:500;color:#f1dcb2}
#gatePass{background:#0f0904;color:#f7ead0;border:1px solid #6b4a20;text-align:center}
.unlockbtn{background:linear-gradient(#f1d37c,#c9982c);border:1px solid #7a5a10;color:#3b2604;font-weight:700}
.gateerr{margin:0;color:#ff8a80;font-weight:600}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.lockwrap{animation:none}.door{transition:none}}
.fav{color:#000;font-weight:700}
.stars{color:#e6a700;-webkit-text-stroke:.6px #7a5200;letter-spacing:2px;margin-left:8px;font-size:18px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.stars i{font-style:normal;display:inline-block;animation:twinkle 1.6s ease-in-out infinite}
.stars i:nth-child(2){animation-delay:.2s}.stars i:nth-child(3){animation-delay:.4s}.stars i:nth-child(4){animation-delay:.6s}.stars i:nth-child(5){animation-delay:.8s}
@keyframes twinkle{0%,100%{color:#e6a700;transform:scale(1);filter:drop-shadow(0 0 0 #fff)}50%{color:#fff6a8;transform:scale(1.25);filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px #fff)}}
@media (prefers-reduced-motion:reduce){.stars i{animation:none}}
.swatch{display:inline-block;width:14px;height:14px;border-radius:3px;background:#000;vertical-align:-2px;margin-right:8px;box-shadow:0 0 0 2px #fff}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:var(--accent-soft);color:var(--fg);font-size:13px;padding:4px 10px;border-radius:6px}
ul.list{margin:0;padding-left:18px;display:grid;gap:6px}

/* edit mode */
input,textarea{font:inherit;width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:6px 8px}
textarea{min-height:60px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px}

@media (max-width:720px){
  .grid{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr 1fr;gap:14px;padding:16px}
  .hero .photo{width:100%;height:auto;aspect-ratio:180/260}
  .hero .ident{grid-column:1/-1;order:3}
  dl{grid-template-columns:1fr;row-gap:2px}
  dd{margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="mainWrap">
  <div id="app"></div>
</div>
<div class="toast" id="toast" hidden></div>

};
const KEY="student-profile-siam-v20";
let data = {...SAMPLE};
let editing=false;

function load(){try{const s=localStorage.getItem(KEY);if(s)return Object.assign({},SAMPLE,JSON.parse(s))}catch(e){}return {...SAMPLE}}
function isSample(){try{return !localStorage.getItem(KEY)}catch(e){return true}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){return false}}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();

function field(k,label,opts={}){
  if(editing){
    const el=opts.area?`<textarea id="f_${k}" data-k="${k}">${esc(data[k])}</textarea>`:`<input id="f_${k}" data-k="${k}" value="${esc(data[k])}">`;
    return `<dt><label for="f_${k}">${label}</label></dt><dd>${el}${opts.hint?`<div class="hint">${opts.hint}</div>`:""}</dd>`;
  }
  if(!data[k])return "";
  return `<dt>${label}</dt><dd class="${opts.mono?"mono":""}">${esc(data[k])}</dd>`;
}
const lines=s=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);

function render(){
  
  
  
  const results=lines(data.results).map(l=>l.split("|"));
  const cg=parseFloat(data.cgpa)||0;
  const photo=data.photo?`<img src="${data.photo}" alt="Photo of ${esc(data.name)}">`:`<span class="initials">${esc(initials(data.name))}</span>`;
  document.getElementById("app").innerHTML=`
  <section class="hero">
    <div class="photo">${photo}${editing?`<label for="photoIn">Change photo</label><input type="file" id="photoIn" accept="image/*" hidden>`:""}</div>
    <div class="ident">
      ${editing?`<input id="f_name" data-k="name" value="${esc(data.name)}" aria-label="Name"><input id="f_nameBn" data-k="nameBn" value="${esc(data.nameBn)}" aria-label="Name in Bangla"><input id="f_bio" data-k="bio" value="${esc(data.bio)}" aria-label="Bio">`
      :`<h1>${esc(data.name)}</h1>${data.nameBn?`<div class="sub">${esc(data.nameBn)}</div>`:""}${data.bio?`<div class="sub bio">${esc(data.bio)}</div>`:""}${data.caption?`<div class="caption">${esc(data.caption)}</div>`:""}`}
      
      <div class="chips">
        ${data.regNo?`<span class="chip">Roll ${esc(data.regNo)}</span>`:""}
        ${data.session?`<span class="chip">HSC Batch ${esc(data.session)}</span>`:""}
        ${data.status?`<span class="chip ok">${esc(data.status)}</span>`:""}
        ${data.target?`<span class="chip goal">🎯 Target: ${esc(data.target)}</span>`:""}
      </div>
    </div>
    ${data.photo2?`<div class="photo"><img src="${data.photo2}" alt="Another photo of ${esc(data.name)}"></div>`:""}
  </section>

  <div class="grid">
    <section class="panel">
      <h2>Academic</h2>
      <dl>
        ${field("school","College")}
        ${field("collegeAddr","College address")}
        ${field("program","Class")}
        ${field("dept","Group")}
        ${field("semester","Section")}
        ${field("regNo","Roll",{mono:true})}
        ${field("session","HSC batch",{mono:true})}
        ${field("supervisor","Class teacher")}
        ${field("target","Target")}
      </dl>
    </section>

    <section class="panel">
      <h2>Result</h2>
      ${editing?`<dl>${field("results","Exam results",{area:true,hint:"এক লাইনে একটি: পরীক্ষা|GPA, যেমন SSC|5.00 বা Half-yearly|4.75"})}</dl>`:`
      <div class="tbl"><table><thead><tr><th>Exam</th><th>GPA / Marks</th></tr></thead><tbody>
      ${results.map(r=>`<tr><td>${esc(r[0])}</td><td class="num">${esc(r[1]||"")}</td></tr>`).join("")}
      </tbody></table></div>`}
    </section>

    <section class="panel">
      <h2>Contact</h2>
      <dl>
        ${editing?field("facebook","Facebook link"):""}${editing?field("tiktok","TikTok username"):""}
      </dl>
      <div class="social">${!editing&&data.facebook?`<a class="wa fb" href="${esc(data.facebook)}" target="_blank" rel="noopener">Facebook profile</a>`:""}${!editing&&data.tiktok?`<a class="wa tt" href="https://www.tiktok.com/@${esc(String(data.tiktok).replace(/^@/,""))}" target="_blank" rel="noopener">TikTok</a>`:""}</div>
    </section>

    <section class="panel">
      <h2>Previous education</h2>
      <dl>${field("ssc","SSC (school, GPA, year)")}${field("jsc","JSC / Class 8")}</dl>
    </section>

    <section class="panel">
      <h2>Skills</h2>
      ${editing?`<dl>${field("skills","Skills",{area:true,hint:"কমা দিয়ে আলাদা করুন"})}</dl>`
      :`<div class="tags">${String(data.skills||"").split(",").map(s=>s.trim()).filter(Boolean).map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div>`}
    </section>

    <section class="panel full">
      <h2>Achievements and activities</h2>
      ${editing?`<dl>
        
        ${field("achievements","Achievements",{area:true,hint:"প্রতি লাইনে একটি"})}
        ${field("clubs","Clubs & hobbies",{area:true,hint:"প্রতি লাইনে একটি"})}
      </dl>`:`<div class="grid">
        
        <div style="display:grid;gap:14px">
          <div><dt style="margin-bottom:6px">Achievements</dt><ul class="list">${lines(data.achievements).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
          <div><dt style="margin-bottom:6px">Clubs & hobbies</dt><ul class="list">${lines(data.clubs).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        </div></div>`}
    </section>
    ${data.dob?`<section class="panel full">
      <h2>Birthday</h2>
      <dl><dt>Date of birth</dt><dd>🎂 ${esc(data.dob)} <span class="stars" aria-label="stars"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></span></dd></dl>
    </section>`:""}
    <section class="panel full favs">
      <h2>Favourites</h2>
      <dl>${data.favColor?`<dt>Favourite colour</dt><dd class="fav"><span class="swatch"></span>${esc(data.favColor)} <span class="stars" aria-label="5 out of 5 stars"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></span></dd>`:""}${data.favFood?`<dt>Favourite food</dt><dd>🍛 ${esc(data.favFood)} <span class="stars" aria-label="5 out of 5 stars"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></span></dd>`:""}</dl>
    </section>
  </div>`;

  colorize();
  if(!editing){
    document.querySelectorAll(".grid > .panel:not(.qr)").forEach(p=>{p.hidden=!p.querySelector("dd,li,.tag,td,.social a")});
  }
  if(editing){
    document.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("input",()=>{data[el.dataset.k]=el.value}));
    const pin=document.getElementById("photoIn");
    pin.addEventListener("change",()=>{
      const f=pin.files[0]; if(!f)return;
      const img=new Image(), r=new FileReader();
      r.onload=()=>{img.onload=()=>{
        const c=document.createElement("canvas"), W=360, H=Math.round(W*img.height/img.width);
        c.width=W;c.height=H;c.getContext("2d").drawImage(img,0,0,W,H);
        data.photo=c.toDataURL("image/jpeg",0.85); render();
      };img.src=r.result};
      r.readAsDataURL(f);
    });
  }
}
function colorize(){
  let i=0;
  document.querySelectorAll(".brand,.sample,.ident .sub,.chip,h2,dt,dd,th,td,li,.tag,.qrtxt,.hint").forEach(el=>{
    if(el.querySelector("input,textarea")||el.classList.contains("fav"))return;
    const h=Math.round((i*137.508)%360); i++;
    el.style.color=`hsl(${h} 85% 26%)`;
  });
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2200)}
render();
</script>
